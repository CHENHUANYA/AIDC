name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  javascript:
    name: JavaScript unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Node test runner
        run: node --test

  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-postgresql.txt
            requirements-dev.txt

      - name: Prepare CI env files
        shell: bash
        run: |
          cp .env.example .env
          cp .env.postgresql.example .env.postgresql
          sed -i 's/^ADMIN_INITIAL_PASSWORD=.*/ADMIN_INITIAL_PASSWORD=ci-admin-password-change-me-1234567890/' .env
          sed -i 's/^ALARM_RAG_TRIGGER_TOKEN=.*/ALARM_RAG_TRIGGER_TOKEN=ci-trigger-token-change-me-1234567890/' .env
          sed -i 's/^N8N_ENCRYPTION_KEY=.*/N8N_ENCRYPTION_KEY=ci-n8n-encryption-key-change-me-1234567890/' .env
          sed -i 's/^QDRANT_API_KEY=.*/QDRANT_API_KEY=ci-qdrant-api-key-change-me-1234567890/' .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres-password-change-me-1234567890/' .env.postgresql
          mkdir -p backups/postgresql-local-secrets
          printf '%s' 'ci-postgres-password-change-me-1234567890' > backups/postgresql-local-secrets/postgres_password
          chmod 600 backups/postgresql-local-secrets/postgres_password

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: mypy
        run: mypy

      - name: RAG answer quality gate
        run: python scripts/rag_answer_quality_evaluation.py

      - name: Audit runtime dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        # Chroma is used only through the embedded PersistentClient. PYSEC-2026-311
        # affects the separately launched, network-facing `chroma run` server.
        run: >
          python -m pip_audit
          --requirement requirements-postgresql.txt
          --ignore-vuln PYSEC-2026-311

      - name: Alembic migration SQL dry-run
        shell: bash
        run: |
          mkdir -p tests_tmp
          set -a
          . ./.env.postgresql
          set +a
          python -m alembic upgrade head --sql > tests_tmp/alembic_upgrade_head.sql

      - name: Pytest
        run: coverage run -m pytest -q --basetemp tests_tmp/pytest-ci

      - name: Coverage gate
        run: coverage report

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build base app image
        run: docker build --build-arg RAG_PRELOAD_MODELS=0 -f Dockerfile -t alarm-rag-ci:base .

      - name: Build PostgreSQL app image
        run: docker build --build-arg RAG_PRELOAD_MODELS=0 -f Dockerfile.postgresql -t alarm-rag-ci:postgresql .
  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare CI env files
        run: |
          cp .env.example .env
          cp .env.postgresql.example .env.postgresql
          sed -i 's/^ADMIN_INITIAL_PASSWORD=.*/ADMIN_INITIAL_PASSWORD=ci-admin-password-change-me-1234567890/' .env
          sed -i 's/^ALARM_RAG_TRIGGER_TOKEN=.*/ALARM_RAG_TRIGGER_TOKEN=ci-trigger-token-change-me-1234567890/' .env
          sed -i 's/^N8N_ENCRYPTION_KEY=.*/N8N_ENCRYPTION_KEY=ci-n8n-encryption-key-change-me-1234567890/' .env
          sed -i 's/^QDRANT_API_KEY=.*/QDRANT_API_KEY=ci-qdrant-api-key-change-me-1234567890/' .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres-password-change-me-1234567890/' .env.postgresql
          mkdir -p backups/postgresql-local-secrets
          printf '%s' 'ci-postgres-password-change-me-1234567890' > backups/postgresql-local-secrets/postgres_password
          chmod 600 backups/postgresql-local-secrets/postgres_password

      - name: Validate base Compose config
        run: docker compose --env-file .env config --quiet

      - name: Validate PostgreSQL file-secret Compose config
        run: >
          docker compose -p aidc_phase1
          --env-file .env
          --env-file .env.postgresql
          -f docker-compose.yml
          -f docker-compose.postgresql.yml
          -f docker-compose.postgresql-pitr.yml
          -f docker-compose.postgresql-runtime.yml
          -f docker-compose.postgresql-secrets.yml
          config --quiet
      - name: Validate PostgreSQL file-secret overlay contract
        run: |
          mkdir -p tests_tmp
          docker compose -p aidc_phase1 \
            --env-file .env \
            --env-file .env.postgresql \
            -f docker-compose.yml \
            -f docker-compose.postgresql.yml \
            -f docker-compose.postgresql-pitr.yml \
            -f docker-compose.postgresql-runtime.yml \
            -f docker-compose.postgresql-secrets.yml \
            config --format json > tests_tmp/postgresql-file-secret-compose.json
          python scripts/postgresql_secret_overlay_check.py tests_tmp/postgresql-file-secret-compose.json
