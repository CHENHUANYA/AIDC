<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alarm RAG Login</title>
  <meta name="description" content="Sinumerik Alarm RAG 智慧維護平台 — 登入系統">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/alarm_app.css">
  <link rel="stylesheet" href="/static/login.css">
</head>
<body data-page="login">

  <!-- animated background -->
  <div class="lg-bg">
    <div class="lg-grid"></div>
    <div class="lg-glow lg-glow--1"></div>
    <div class="lg-glow lg-glow--2"></div>
    <div class="lg-glow lg-glow--3"></div>
  </div>

  <main class="login-shell">
    <section class="login-panel" id="loginPanel">

      <!-- brand -->
      <div class="lg-brand">
        <div class="lg-brand-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </div>
        <div>
          <h1 class="lg-title">ALARM RAG</h1>
          <p class="lg-subtitle">智慧維護平台 · Sinumerik 警報知識庫</p>
        </div>
      </div>

      <!-- divider -->
      <div class="lg-divider"><span>帳號登入</span></div>

      <!-- form -->
      <form class="lg-form" id="loginForm">
        <div class="lg-field">
          <label class="lg-label" for="loginUsername">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            帳號
          </label>
          <input class="lg-input" id="loginUsername" autocomplete="username" placeholder="輸入使用者帳號" value="operator01">
        </div>
        <div class="lg-field">
          <label class="lg-label" for="loginPassword">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            密碼
          </label>
          <input class="lg-input" id="loginPassword" type="password" autocomplete="current-password" placeholder="輸入密碼" value="demo1234">
        </div>
        <button class="lg-submit" id="loginSubmit" type="submit">
          <span>登入系統</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
        <div class="upload-result" id="loginResult"></div>
      </form>

      <!-- quick accounts -->
      <div class="lg-divider"><span>快速切換帳號</span></div>
      <div class="lg-accounts">
        <button type="button" class="lg-account" data-user="operator01">
          <div class="lg-account-icon lg-account-icon--blue">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          </div>
          <div class="lg-account-info">
            <b>operator01</b>
            <span>LINE-A 產線操作員</span>
          </div>
        </button>
        <button type="button" class="lg-account" data-user="maintenance01">
          <div class="lg-account-icon lg-account-icon--green">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
          </div>
          <div class="lg-account-info">
            <b>maintenance01</b>
            <span>維修工單佇列</span>
          </div>
        </button>
        <button type="button" class="lg-account" data-user="supervisor01">
          <div class="lg-account-icon lg-account-icon--amber">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>
          <div class="lg-account-info">
            <b>supervisor01</b>
            <span>全產線 + 驗證 + KPI</span>
          </div>
        </button>
        <button type="button" class="lg-account" data-user="admin01">
          <div class="lg-account-icon lg-account-icon--purple">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </div>
          <div class="lg-account-info">
            <b>admin01</b>
            <span>知識庫管理 + 系統設定</span>
          </div>
        </button>
      </div>

      <div class="lg-hint">
        Demo 密碼：<code>demo1234</code>
      </div>
    </section>
  </main>

  <script src="/static/js/core/api.js?v=auth-3"></script>
  <script src="/static/js/pages/login.js?v=auth-3"></script>
</body>
</html>
