services:
  alarm_rag:
    build:
      context: .
      args:
        RAG_PRELOAD_MODELS: ${RAG_PRELOAD_MODELS:-0}
    container_name: alarm_rag
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      ALARM_RAG_ENV: ${ALARM_RAG_ENV:-production}
      ALARM_RAG_CORS_ORIGINS: ${ALARM_RAG_CORS_ORIGINS:-http://localhost:8100,http://127.0.0.1:8100}
      ALARM_RAG_LOG_LEVEL: ${ALARM_RAG_LOG_LEVEL:-INFO}
      ALARM_RAG_LOG_FORMAT: ${ALARM_RAG_LOG_FORMAT:-json}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-change-me-now}
      ALARM_RAG_TRIGGER_TOKEN: ${ALARM_RAG_TRIGGER_TOKEN:-}
      ALARM_RAG_INDEX_SIGNING_KEY: ${ALARM_RAG_INDEX_SIGNING_KEY:?Set ALARM_RAG_INDEX_SIGNING_KEY in .env}
      ALARM_RAG_INDEX_MAX_MB: ${ALARM_RAG_INDEX_MAX_MB:-128}
      PYTHONDONTWRITEBYTECODE: "1"
      TMPDIR: /tmp
      DB_PATH: /app/alarm_db
      HF_HOME: /app/hf_cache
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      RAG_HF_LOCAL_ONLY: ${RAG_HF_LOCAL_ONLY:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral-nemo:latest}
      RAG_LLM_TIMEOUT_SECONDS: ${RAG_LLM_TIMEOUT_SECONDS:-90}
      RAG_CHAT_TOP_K: ${RAG_CHAT_TOP_K:-3}
      RAG_CONTEXT_CHARS_PER_DOC: ${RAG_CONTEXT_CHARS_PER_DOC:-1800}
      RAG_MAX_OUTPUT_TOKENS: ${RAG_MAX_OUTPUT_TOKENS:-512}
      RAG_OLLAMA_NUM_CTX: ${RAG_OLLAMA_NUM_CTX:-4096}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      SCHOOL_API_BASE_URL: ${SCHOOL_API_BASE_URL:-}
      SCHOOL_API_KEY: ${SCHOOL_API_KEY:-}
      SCHOOL_API_MODEL: ${SCHOOL_API_MODEL:-gpt-oss-120b}
      SCHOOL_API_FALLBACK_TO_OLLAMA: ${SCHOOL_API_FALLBACK_TO_OLLAMA:-true}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      RAG_RERANKER_MODEL: ${RAG_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RAG_RETRIEVAL_STRATEGY: ${RAG_RETRIEVAL_STRATEGY:-hybrid}
      VECTOR_STORE: ${VECTOR_STORE:-qdrant}
      QDRANT_HOST: qdrant
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_HTTPS: ${QDRANT_HTTPS:-false}
      QDRANT_INSECURE_TRUSTED_HOSTS: ${QDRANT_INSECURE_TRUSTED_HOSTS:-qdrant,localhost,127.0.0.1,::1}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-1024}
      QDRANT_UPSERT_BATCH_SIZE: ${QDRANT_UPSERT_BATCH_SIZE:-64}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-auto}
      LOGIN_FAILURE_LIMIT: ${LOGIN_FAILURE_LIMIT:-5}
      LOGIN_FAILURE_WINDOW_SECONDS: ${LOGIN_FAILURE_WINDOW_SECONDS:-300}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-300}
      LOGIN_RATE_MAX_KEYS: ${LOGIN_RATE_MAX_KEYS:-10000}
    ports:
      - "${ALARM_RAG_BIND_ADDRESS:-127.0.0.1}:${ALARM_RAG_PORT:-8100}:8000"
    volumes:
      - ./alarm_db:/app/alarm_db
      - ./data:/app/data
      - ./mock_data:/app/mock_data:ro
      - ./backups:/app/backups
      - ./hf_cache:/app/hf_cache
      - ./static:/app/static:ro
      - ./routes:/app/routes:ro
      - ./operator.html:/app/operator.html:ro
      - ./maintenance.html:/app/maintenance.html:ro
      - ./supervisor.html:/app/supervisor.html:ro
      - ./dashboard.html:/app/dashboard.html:ro
      - ./assistant.html:/app/assistant.html:ro
      - ./admin.html:/app/admin.html:ro
      - ./login.html:/app/login.html:ro
      - ./operations.html:/app/operations.html:ro
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  qdrant:
    image: qdrant/qdrant:v1.16.1@sha256:db1c735496dfa982ef27576a17b624e48e6b46a140bcdc2ac34e39d186204ef5
    container_name: alarm_rag_qdrant
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
      QDRANT__TELEMETRY_DISABLED: ${QDRANT_TELEMETRY_DISABLED:-true}
    ports:
      - "${QDRANT_BIND_ADDRESS:-127.0.0.1}:${QDRANT_HTTP_PORT:-6333}:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/127.0.0.1/6333'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  n8n:
    image: n8nio/n8n:1.123.68@sha256:42249f346df7360fa19f9659c0d167f35e64db1cfa7a363d0a57592503cd8b8c
    container_name: alarm_rag_n8n
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${N8N_BIND_ADDRESS:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      ALARM_RAG_TRIGGER_TOKEN: ${ALARM_RAG_TRIGGER_TOKEN:-}
      GENERIC_TIMEZONE: Asia/Taipei
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: ${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}
      N8N_RUNNERS_ENABLED: ${N8N_RUNNERS_ENABLED:-true}
      DB_SQLITE_POOL_SIZE: ${N8N_DB_SQLITE_POOL_SIZE:-2}
      # The tracked workflow reads only ALARM_RAG_TRIGGER_TOKEN from $env.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      N8N_PERSONALIZATION_ENABLED: ${N8N_PERSONALIZATION_ENABLED:-false}
      N8N_VERSION_NOTIFICATIONS_ENABLED: ${N8N_VERSION_NOTIFICATIONS_ENABLED:-false}
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./mock_data:/mock_data:ro
    depends_on:
      alarm_rag:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
