services:
  alarm_rag:
    environment: !override
      ALARM_RAG_ENV: ${ALARM_RAG_ENV:-production}
      ALARM_RAG_CORS_ORIGINS: ${ALARM_RAG_CORS_ORIGINS:-http://localhost:8100,http://127.0.0.1:8100}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-change-me-now}
      ALARM_RAG_TRIGGER_TOKEN: ${ALARM_RAG_TRIGGER_TOKEN:-}
      DB_PATH: /app/alarm_db
      HF_HOME: /app/hf_cache
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      RAG_HF_LOCAL_ONLY: ${RAG_HF_LOCAL_ONLY:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral-nemo:latest}
      RAG_LLM_TIMEOUT_SECONDS: ${RAG_LLM_TIMEOUT_SECONDS:-90}
      SCHOOL_API_BASE_URL: ${SCHOOL_API_BASE_URL:-}
      SCHOOL_API_KEY: ${SCHOOL_API_KEY:-}
      SCHOOL_API_MODEL: ${SCHOOL_API_MODEL:-gpt-oss-120b}
      SCHOOL_API_FALLBACK_TO_OLLAMA: ${SCHOOL_API_FALLBACK_TO_OLLAMA:-true}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      RAG_RERANKER_MODEL: ${RAG_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      VECTOR_STORE: ${VECTOR_STORE:-qdrant}
      QDRANT_HOST: qdrant
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-1024}
      QDRANT_UPSERT_BATCH_SIZE: ${QDRANT_UPSERT_BATCH_SIZE:-64}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      POSTGRES_ENABLED: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-alarm_rag}
      POSTGRES_USER: ${POSTGRES_USER:-alarm_rag}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-5}
      POSTGRES_POOL_TIMEOUT: ${POSTGRES_POOL_TIMEOUT:-30}
    secrets:
      - postgres_password

  postgres:
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE:-./backups/postgresql-local-secrets/postgres_password}
