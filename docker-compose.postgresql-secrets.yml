services:
  alarm_rag:
    environment:
      # An explicit empty value prevents Compose from resolving a null reset
      # from --env-file while ensuring no raw credential reaches the container.
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  postgres:
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE:-./backups/postgresql-local-secrets/postgres_password}
