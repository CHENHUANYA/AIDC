services:
  alarm_rag:
    build:
      dockerfile: Dockerfile.postgresql
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1"]
    environment:
      POSTGRES_ENABLED: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-alarm_rag}
      POSTGRES_USER: ${POSTGRES_USER:-alarm_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-a-long-random-password}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-5}
      POSTGRES_POOL_TIMEOUT: ${POSTGRES_POOL_TIMEOUT:-30}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.10
    container_name: alarm_rag_postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alarm_rag}
      POSTGRES_USER: ${POSTGRES_USER:-alarm_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-a-long-random-password}
      TZ: Asia/Taipei
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_EXPOSE_PORT:-5432}:5432"
    volumes:
      - alarm_rag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alarm_rag} -d ${POSTGRES_DB:-alarm_rag}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  alarm_rag_postgres_data:
