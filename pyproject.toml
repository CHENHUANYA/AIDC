[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "alarm_db",
    "backups",
    "data",
    "exports",
    "hf_cache",
    "n8n_data",
    "qdrant_data",
    "tests_tmp",
]

[tool.ruff.lint]
# Start with correctness rules across the existing codebase. Style/import
# cleanup can be widened incrementally without making the initial gate noisy.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true
follow_imports = "skip"
files = [
    "api_schemas.py",
    "auth.py",
    "issues.py",
    "main.py",
    "observability.py",
    "work_orders.py",
    "bm25_text.py",
    "db/",
    "secret_values.py",
    "repositories/contracts.py",
    "repositories/postgres_auth.py",
    "repositories/postgres_content.py",
    "repositories/postgres_workflow.py",
    "routes/",
    "scripts/postgresql_backup.py",
    "scripts/postgresql_health.py",
    "scripts/postgresql_secret_overlay_check.py",
    "scripts/preflight_check.py",
    "scripts/stage_postgresql_secret.py",
    "scripts/postgresql_pilot_load.py",
    "scripts/postgresql_secret_rotation.py",
    "scripts/bm25_index_upgrade.py",
    "scripts/rag_offline_evaluation.py",
    "scripts/rag_runtime_check.py",
    "vector_store.py",
]
exclude = "(alarm_db|backups|data|exports|hf_cache|n8n_data|qdrant_data|tests_tmp)/"

[tool.coverage.run]
branch = true
source = [
    "app_context",
    "auth",
    "bm25_text",
    "config_values",
    "db",
    "ingest",
    "issues",
    "observability",
    "pagination",
    "rag_engine",
    "repositories",
    "routes",
    "secret_values",
    "services",
    "storage",
    "vector_store",
    "work_orders",
]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_covered = true
omit = [
    "tests/*",
]
