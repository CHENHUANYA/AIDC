<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alarm RAG 主管工作台</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/supervisor.css">
  <link rel="stylesheet" href="/static/css/answer-trace.css">
</head>
<body data-page="supervisor">
<header>
  <div class="logo">
    <div class="logo-icon">👁️</div>
    <div class="logo-text">
      <h1>主管工作台</h1>
      <p>產線責任、待驗證工單與 RAG 品質追蹤</p>
    </div>
  </div>
  <div class="status-pill">
    <div class="status-dot"></div>
    <span id="supervisorUserLabel">Supervisor</span>
  </div>
</header>

<div class="tabs" aria-label="主管工作台分頁">
  <button class="tab-btn" type="button" onclick="window.location.href='/dashboard'"><span class="tab-icon">BI</span> 儀表板</button>
  <button class="tab-btn active" type="button" data-supervisor-section-target="overview" aria-current="page"><span class="tab-icon">📊</span> 總覽</button>
  <button class="tab-btn" type="button" data-supervisor-section-target="verification"><span class="tab-icon">⏳</span> 待驗證</button>
  <button class="tab-btn" type="button" data-supervisor-section-target="responsibility"><span class="tab-icon">👤</span> 責任追蹤</button>
  <button class="tab-btn" type="button" data-supervisor-section-target="lines"><span class="tab-icon">🏭</span> 產線總覽</button>
  <button class="tab-btn" type="button" data-supervisor-section-target="audit"><span class="tab-icon">📋</span> 稽核</button>
</div>

<main class="panel active">
  <div class="container role-console">

    <div class="sv-toolbar">
      <div class="wo-actions" style="margin:0">
        <button class="wo-btn alt" type="button" onclick="exportSupervisorCsv()" style="margin:0;padding:7px 14px;font-size:12px">匯出 CSV</button>
        <button class="wo-btn alt" type="button" onclick="loadSupervisorConsole()" style="margin:0;padding:7px 14px;font-size:12px">🔄 重新整理</button>
      </div>
    </div>

    <section class="sv-section-panel active" data-supervisor-section="overview">
      <div class="sv-kpi-grid" aria-label="Supervisor KPIs">
        <div class="sv-kpi-card red">
          <div class="sv-kpi-icon">🚨</div>
          <div class="sv-kpi-label">未結問題</div>
          <div class="sv-kpi-value red" id="svOpenIssues">--</div>
          <div class="sv-kpi-sub">尚未完成或驗證</div>
        </div>
        <div class="sv-kpi-card amber">
          <div class="sv-kpi-icon">⏳</div>
          <div class="sv-kpi-label">待驗證</div>
          <div class="sv-kpi-value amber" id="svPendingVerification">--</div>
          <div class="sv-kpi-sub">已完成、待主管確認</div>
        </div>
        <div class="sv-kpi-card red">
          <div class="sv-kpi-icon">⚠️</div>
          <div class="sv-kpi-label">逾期工單</div>
          <div class="sv-kpi-value red" id="svOverdue">--</div>
          <div class="sv-kpi-sub">超過 24 小時未結</div>
        </div>
        <div class="sv-kpi-card green">
          <div class="sv-kpi-icon">✅</div>
          <div class="sv-kpi-label">完成率</div>
          <div class="sv-kpi-value green" id="svCompletionRate">--</div>
          <div class="sv-kpi-sub">已驗證 / 全部</div>
        </div>
        <div class="sv-kpi-card blue">
          <div class="sv-kpi-icon">💬</div>
          <div class="sv-kpi-label">RAG 回饋率</div>
          <div class="sv-kpi-value blue" id="svFeedbackRate">--</div>
          <div class="sv-kpi-sub">有幫助回饋比例</div>
        </div>
      </div>

      <div class="sv-card accent-red">
        <div class="section-label">風險清單</div>
        <div id="svRiskHotlist" class="sv-risk-list">
          <div class="wo-empty">載入中...</div>
        </div>
      </div>
    </section>

    <section class="sv-section-panel" data-supervisor-section="verification">
      <div class="sv-card accent-amber">
        <div class="section-label">⏱️ 待驗證佇列</div>
        <div id="svVerificationQueue" class="role-list">
          <div class="wo-empty">載入中...</div>
        </div>
      </div>
    </section>

    <section class="sv-section-panel" data-supervisor-section="responsibility">
      <div class="sv-card accent-blue">
        <div class="section-label">👤 責任追蹤</div>
        <div class="sv-filter-row">
          <select class="wo-select" id="svLineFilter" aria-label="產線篩選"></select>
          <select class="wo-select" id="svStatusFilter" aria-label="狀態篩選">
            <option value="">全部狀態</option>
            <option value="pending">待處理</option>
            <option value="assigned">已指派</option>
            <option value="in_progress">處理中</option>
            <option value="completed">已完成</option>
          </select>
          <select class="wo-select" id="svPriorityFilter" aria-label="優先等級篩選">
            <option value="">全部優先級</option>
            <option value="critical">緊急</option>
            <option value="high">高</option>
            <option value="medium">中</option>
            <option value="low">低</option>
          </select>
          <input class="wo-input" id="svTextFilter" placeholder="搜尋機台、工單、負責人">
          <label class="settings-toggle" style="padding:9px 12px">
            <input id="svRiskOnly" type="checkbox">
            <span>只看風險</span>
          </label>
        </div>
        <div class="sv-order-edit">
          <select class="wo-select" id="svBulkAssignee" aria-label="批次指派人員"></select>
          <select class="wo-select" id="svBulkPriority" aria-label="批次優先等級">
            <option value="">保留優先級</option>
            <option value="critical">緊急</option>
            <option value="high">高</option>
            <option value="medium">中</option>
            <option value="low">低</option>
          </select>
          <select class="wo-select" id="svBulkStatus" aria-label="批次狀態">
            <option value="">保留狀態</option>
            <option value="pending">待處理</option>
            <option value="assigned">已指派</option>
            <option value="in_progress">處理中</option>
          </select>
          <button class="wo-btn alt" type="button" onclick="bulkUpdateSupervisorOrders()">批次更新目前清單</button>
        </div>
        <div id="svResponsibilityList" class="role-list">
          <div class="wo-empty">載入中...</div>
        </div>
      </div>
    </section>

    <section class="sv-section-panel" data-supervisor-section="lines">
      <div class="sv-card accent-green">
        <div class="section-label">🏭 產線總覽</div>
        <div id="svLineOverview" class="role-list">
          <div class="wo-empty">載入中...</div>
        </div>
      </div>
    </section>

    <section class="sv-section-panel" data-supervisor-section="audit">
      <div class="sv-card accent-purple">
        <div class="section-label">📋 稽核檢視</div>
        <div id="svAuditReview" class="audit-list"><div class="wo-empty">載入中...</div></div>
      </div>
    </section>

    <div class="upload-result" id="svResult"></div>
  </div>
</main>

<script src="/static/js/core/api.js"></script>
<script src="/static/js/core/storage.js"></script>
<script src="/static/alarm_app.js"></script>
<script src="/static/js/modules/audit.js"></script>
<script src="/static/js/modules/answer_trace.js"></script>
<script src="/static/js/pages/supervisor.js"></script>
</body>
</html>
