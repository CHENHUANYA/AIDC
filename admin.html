<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alarm RAG 管理後台</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/admin.css">
  <link rel="stylesheet" href="/static/css/answer-trace.css">
</head>
<body data-page="admin">
<header>
  <div class="logo">
    <div class="logo-icon">⚙️</div>
    <div class="logo-text">
      <h1>管理後台</h1>
      <p>使用者、資料匯入、知識庫與系統設定</p>
    </div>
  </div>
  <div class="status-pill">
    <div class="status-dot"></div>
    <span id="adminUserLabel">Admin</span>
  </div>
</header>

<div class="tabs" aria-label="管理後台分頁">
  <button class="tab-btn active" type="button" data-admin-section-target="overview" aria-current="page"><span class="tab-icon">📊</span> 總覽</button>
  <button class="tab-btn" type="button" data-admin-section-target="users"><span class="tab-icon">👥</span> 使用者</button>
  <button class="tab-btn" type="button" data-admin-section-target="data"><span class="tab-icon">📥</span> 資料匯入</button>
  <button class="tab-btn" type="button" data-admin-section-target="knowledge"><span class="tab-icon">📚</span> 知識庫</button>
  <button class="tab-btn" type="button" data-admin-section-target="quality"><span class="tab-icon">🎯</span> RAG 品質</button>
  <button class="tab-btn" type="button" data-admin-section-target="sessions"><span class="tab-icon">🔐</span> Session 管理</button>
  <button class="tab-btn" type="button" data-admin-section-target="settings"><span class="tab-icon">⚙️</span> 設定與稽核</button>
</div>

<main class="panel active">
  <div class="container role-console">

    <div class="admin-toolbar">
      <div class="wo-actions" style="margin:0">
        <button class="wo-btn alt" type="button" onclick="exportAdminAuditCsv()" style="margin:0;padding:7px 14px;font-size:12px">匯出稽核</button>
        <button class="wo-btn alt" type="button" onclick="loadAdminConsole()" style="margin:0;padding:7px 14px;font-size:12px">🔄 重新整理</button>
      </div>
    </div>

    <section class="admin-section-panel active" data-admin-section="overview">
      <div class="admin-card accent-purple">
        <div class="section-label">營運快照</div>
        <div class="role-kpi-grid compact" id="adminOpsSummary">
          <div class="wo-empty">載入中...</div>
        </div>
      </div>
    </section>

    <section class="admin-section-panel" data-admin-section="users">
      <div class="admin-card accent-blue">
        <div class="section-label">👥 使用者與角色總覽</div>
        <div class="admin-control-row">
          <select class="wo-select" id="adminRoleFilter" aria-label="角色篩選">
            <option value="">全部角色</option>
            <option value="operator">Operator</option>
            <option value="maintenance">Maintenance</option>
            <option value="supervisor">Supervisor</option>
            <option value="admin">Admin</option>
          </select>
          <select class="wo-select" id="adminActiveFilter" aria-label="啟用狀態篩選">
            <option value="">全部狀態</option>
            <option value="active">啟用</option>
            <option value="inactive">停用</option>
          </select>
          <input class="wo-input" id="adminUserSearch" placeholder="搜尋使用者、姓名、團隊、scope">
          <button class="wo-btn alt" type="button" onclick="exportAdminUsersCsv()" style="margin:0">匯出</button>
        </div>
        <div class="admin-control-row">
          <input class="wo-input" id="adminNewUserId" placeholder="user_id">
          <input class="wo-input" id="adminNewUserName" placeholder="顯示名稱">
          <input class="wo-input" id="adminNewUserTeam" placeholder="團隊">
          <select class="wo-select" id="adminNewUserRole" aria-label="新使用者角色">
            <option value="operator">Operator</option>
            <option value="maintenance">Maintenance</option>
            <option value="supervisor">Supervisor</option>
            <option value="admin">Admin</option>
          </select>
          <input class="wo-input" id="adminNewUserScope" placeholder="scope：LINE-A, LINE-B, *">
          <input class="wo-input" id="adminNewUserPassword" type="password" placeholder="密碼（預設 demo1234）">
          <button class="wo-btn" type="button" onclick="createAdminUser()" style="margin:0">建立使用者</button>
        </div>
        <div id="adminUserList" class="role-list"><div class="wo-empty">載入中...</div></div>
      </div>
    </section>

    <section class="admin-section-panel" data-admin-section="data">
      <div class="admin-card accent-green">
        <div class="section-label">📥 資料匯入</div>
        <div class="admin-upload-zone" onclick="document.getElementById('adminExcelFile').click()">
          <div class="uz-icon xlsx">XLSX</div>
          <div class="uz-title">上傳 Excel 工單資料</div>
          <div class="uz-sub">匯入後會更新 Work Order 與 BI 統計</div>
        </div>
        <input type="file" id="adminExcelFile" accept=".xlsx,.xls" style="display:none" onchange="uploadAdminExcel(this)">
        <div class="excel-result" id="adminExcelResult"></div>
        <div id="adminImportLog" class="role-list role-list-spaced"></div>
      </div>
    </section>

    <section class="admin-section-panel" data-admin-section="sessions">
      <div class="admin-card accent-blue">
        <div class="section-label">Session 監控</div>
        <div class="admin-control-row">
          <button class="wo-btn alt" type="button" onclick="loadAdminSessions()" style="margin:0">重新整理 Session</button>
        </div>
        <div id="adminSessionList" class="role-list"><div class="wo-empty">載入中...</div></div>
      </div>
    </section>

    <section class="admin-section-panel" data-admin-section="knowledge">
      <div class="admin-card accent-purple">
        <div class="section-label">📚 知識庫管理</div>
        <div class="admin-kb-filter">
          <select class="wo-select" id="adminKbCollection" aria-label="知識庫集合">
            <option value="808d">808D</option>
            <option value="840d">840D / 840Di / 810D</option>
            <option value="840dsl">840D sl</option>
            <option value="furnace_b85t">FURNACE B85T</option>
          </select>
          <button class="wo-btn alt" type="button" onclick="loadAdminKb()">🔄 重整 KB</button>
          <button class="wo-btn alt" type="button" onclick="rebuildAdminKb()">⚡ 重建索引</button>
          <button class="wo-btn alt" type="button" onclick="rebuildAllAdminKb()">全部重建</button>
          <button class="wo-btn alt" type="button" onclick="exportAdminKbCsv()">匯出文件</button>
        </div>
        <div class="admin-upload-zone" onclick="document.getElementById('adminPdfFile').click()" style="margin-bottom:16px">
          <div class="uz-icon pdf">PDF</div>
          <div class="uz-title">上傳 PDF 手冊或維修文件至目前知識庫</div>
          <div class="uz-sub">支援技術手冊、維修 SOP、故障排除文件</div>
        </div>
        <input type="file" id="adminPdfFile" accept=".pdf" style="display:none" onchange="uploadAdminPdf(this)">
        <div id="adminKbHealth" class="admin-health-grid">
          <div class="wo-empty">載入中...</div>
        </div>
        <div class="role-kpi-grid compact" id="adminKbSummary"></div>
        <div class="admin-ingest-form">
          <div class="section-label" style="margin-bottom:10px">✏️ 文字寫入</div>
          <div class="ingest-inputs">
            <input type="text" id="adminIngestCode" placeholder="Alarm code（選填）">
            <input type="text" id="adminIngestTitle" placeholder="標題（選填）">
          </div>
          <textarea id="adminIngestText" placeholder="新增 SOP、公告或已驗證維修紀錄"></textarea>
          <div class="wo-actions" style="margin-top:0">
            <button class="wo-btn" id="adminIngestBtn" type="button" onclick="ingestAdminText()">📝 寫入知識庫</button>
          </div>
        </div>
        <div class="upload-result" id="adminKbResult"></div>
        <div id="adminKbDocs" class="kb-doc-list" style="margin-top:16px"><div class="log-empty">載入中...</div></div>
      </div>
    </section>

    <section class="admin-section-panel" data-admin-section="quality">
      <div class="admin-card accent-red">
        <div class="section-label">🎯 RAG 品質審核</div>
        <div class="rag-quality-toolbar">
          <select class="wo-select" id="adminQualityFilter" aria-label="品質篩選">
            <option value="gaps">待處理缺口</option>
            <option value="candidates">候選知識</option>
            <option value="feedback">最近回饋</option>
            <option value="all">全部</option>
          </select>
          <input class="wo-input" id="adminQualitySearch" placeholder="搜尋 alarm code、manual、工單、缺漏說明">
          <button class="wo-btn alt" type="button" onclick="exportAdminQualityCsv()" style="margin:0">匯出品質清單</button>
        </div>
        <div class="role-kpi-grid compact" id="adminQualitySummary">
          <div class="wo-empty">載入中...</div>
        </div>
        <div class="upload-result" id="adminQualityResult"></div>
        <div class="rag-quality-split">
          <div>
            <div class="section-label small">待處理缺口與候選知識</div>
            <div id="adminQualityList" class="role-list"><div class="wo-empty">載入中...</div></div>
          </div>
          <div>
            <div class="section-label small">最近 RAG 回饋</div>
            <div id="adminQualityFeedbackList" class="role-list"><div class="wo-empty">載入中...</div></div>
          </div>
        </div>
      </div>
    </section>

    <section class="admin-section-panel" data-admin-section="settings">
      <div class="admin-grid">
      <div class="admin-card accent-amber">
        <div class="section-label">⚙️ 系統設定</div>
        <div class="admin-settings-grid">
          <div class="wo-field">
            <label class="wo-field-label">預設手冊</label>
            <select class="wo-select" id="adminDefaultManual">
              <option value="808d">808D</option>
              <option value="840d">840D</option>
              <option value="840dsl">840D sl</option>
              <option value="furnace_b85t">FURNACE B85T</option>
            </select>
          </div>
          <div class="wo-field">
            <label class="wo-field-label">登入有效時數</label>
            <input class="wo-input" id="adminSessionHours" type="number" min="1" max="72" step="1">
          </div>
          <label class="settings-toggle">
            <input id="adminAllowOperatorReopen" type="checkbox">
            <span>允許 Operator 重新開啟已完成問題</span>
          </label>
        </div>
        <div class="wo-actions">
          <button class="wo-btn" type="button" onclick="saveAdminSettings()">💾 儲存設定</button>
          <button class="wo-btn alt" type="button" onclick="loadAdminSettings()">🔄 重新載入</button>
        </div>
        <div class="upload-result" id="adminSettingsResult"></div>
      </div>

      <div class="admin-card accent-red">
        <div class="section-label">📋 系統稽核</div>
        <div id="adminAuditList" class="audit-list"><div class="wo-empty">載入中...</div></div>
      </div>
    </div>
    </section>

  </div>
</main>

<script src="/static/js/core/api.js"></script>
<script src="/static/alarm_app.js"></script>
<script src="/static/js/modules/audit.js"></script>
<script src="/static/js/modules/answer_trace.js"></script>
<script src="/static/js/pages/admin.js"></script>
</body>
</html>
