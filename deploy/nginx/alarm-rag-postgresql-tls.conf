# These shared zones belong in the nginx http context. Files under conf.d are
# normally included there; move the declarations to nginx.conf if necessary.
limit_req_zone $binary_remote_addr zone=ready_per_ip:10m rate=1r/s;
limit_req_zone $server_name zone=ready_global:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ready_conn_per_ip:10m;
limit_conn_zone $server_name zone=ready_conn_global:1m;

server {
    listen 443 ssl http2;
    server_name alarm-rag.example.com;

    ssl_certificate /etc/nginx/certs/alarm-rag.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/alarm-rag.privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location = /ready {
        limit_req zone=ready_per_ip burst=2 nodelay;
        limit_req zone=ready_global burst=10 nodelay;
        limit_req_status 429;
        limit_conn ready_conn_per_ip 2;
        limit_conn ready_conn_global 20;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:8100/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
